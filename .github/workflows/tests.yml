name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and web dependencies
        run: python -m pip install --upgrade pip pytest "flask>=3.0,<4" "cryptography>=42" "waitress>=3.0"
      - name: Run the full test suite (plain store)
        run: python -m pytest -q
      - name: Run the engine suite on the encrypted store
        env:
          LAYLAW_TEST_STORE: encrypted
        run: python -m pytest -q
      - name: No secrets or data directories committed
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env|laylaw-data|data/vault|.*\.sqlite3|.*\.enc)$'; then
            echo "Data or secret files are tracked" && exit 1
          fi
          if git grep -nE 'LAYLAW_MASTER_KEY *= *[A-Za-z0-9_-]{40,}' -- . ':!tests'; then
            echo "A master key appears in source" && exit 1
          fi
      - name: Naming check (Laylaw only; no legacy project name)
        run: |
          # The legacy name is matched by a character class so it never appears in this repo.
          if grep -rniIE --exclude-dir=.git "t[e]rminator" .; then
            echo "Found the legacy project name; use Laylaw only." && exit 1
          fi
