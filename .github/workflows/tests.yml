name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run the full test suite
        run: python -m pytest -q
      - name: Naming check (Laylaw only; no legacy project name)
        run: |
          # The legacy name is matched by a character class so it never appears in this repo.
          if grep -rniIE --exclude-dir=.git "t[e]rminator" .; then
            echo "Found the legacy project name; use Laylaw only." && exit 1
          fi
