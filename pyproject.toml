[project]
name = "laylaw"
version = "0.1.0"
description = "Laylaw Interviewer - neutral, structured fact-gathering for adults"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
web = ["flask>=3.0,<4", "cryptography>=42", "waitress>=3.0"]

[tool.setuptools.packages.find]
include = ["laylaw*"]

[tool.setuptools.package-data]
"laylaw.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
